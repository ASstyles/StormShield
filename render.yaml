# ========================================================
# STORMSHIELD X — RENDER BLUEPRINT (SINGLE WEB SERVICE)
# Unified single container: React Frontend + FastAPI Backend
# URL: https://stormshield.onrender.com
# ========================================================
version: "1"

services:
  - type: web
    name: stormshield
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: stormshield-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TEMPERATURE
        value: "0.2"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://stormshield.onrender.com"
      - key: ENV
        value: production

databases:
  - name: stormshield-db
    databaseName: stormshield
    user: stormshield
    plan: free
    region: oregon
